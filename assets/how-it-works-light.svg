<text x="64" y="225" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#4B5563">Asks only what it can't deduce.</text><path d="M323 150 l14 0 m-6 -7 l7 7 l-7 7" stroke="#14213D" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="345" y="40" width="275" height="220" rx="14" fill="#FFFFFF"/>
