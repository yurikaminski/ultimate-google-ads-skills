<text x="369" y="160" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14213D">Diagnose</text>
<text x="369" y="200" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#4B5563">Queue/starvation test (S16)</text>
<text x="369" y="225" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#4B5563">finds ONE constraint, with CIs.</text><path d="M628 150 l14 0 m-6 -7 l7 7 l-7 7" stroke="#14213D" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="650" y="40" width="275" height="220" rx="14" fill="#FFFFFF"/>
