<text x="979" y="160" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14213D">Measure</text>
<text x="979" y="200" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#4B5563">Frozen windows, local memory,</text>
<text x="979" y="225" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#4B5563">close the loop, find the next one.</text><path d="M1180 270 C1180 320 120 320 120 270" stroke="#4B5563" stroke-width="2.5" stroke-dasharray="6 8" fill="none"/><text x="640" y="336" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#4B5563" text-anchor="middle">repeat: when the constraint moves, baselines reset</text></svg>